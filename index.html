<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Character Counter</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Changa+One:ital@0;1&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Space+Grotesk:wght@300..700&display=swap" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Changa+One:ital@0;1&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Space+Grotesk:wght@300..700&display=swap" rel="stylesheet">
</head>
<body>
    <section>
        <div>
            <img src="assets/images/logo.jpg" alt="Imagen del logo">
            <button><img src="assets/images/sol.jpg" alt="imagen de sol"></button>
            <h2>Analyze your text in real-time.</h2>
            <textarea>
                <p>Design is the silent ambassador of your brand. Simplicity is key to effective communication, creating clarity in every interaction. A great design transforms complex ideas into elegant solutions, making them easy to understand. It blends aesthetics and functionality seamlessly.</p>
            </textarea>
        </div>
        <div>
            <div>
                <label for="">
                    Exclude Spaces
                    <input type="checkbox">
                </label>
                <label for="">
                    Set Character Limit
                    <input type="checkbox">
                </label>
            </div>
            <div>
                <p>Approx. reading time: &lt;1 minute</p>
            </div>
        </div>
        <div>
            <ul>
                <li>
                    <img src="assets/images/violet.jpg" alt="Fondo violeta">
                    <p><strong>278</strong>Total Characters</p>
                </li>
                <li>
                   <img src="assets/images/orange.jpg" alt="Fondo naranja">
                    <p><strong>39</strong>Word Count</p> 
                </li>
                <li>
                    <img src="assets/images/pastel-orange.jpg" alt="Fondo naranja pastel">
                    <p><strong>04</strong>Sentence Count</p>
                </li>
            </ul>
        </div>
        <div>
            <h4>Letter Density</h4>
            <div>
                <label for="">
                    40 (16.06%)
                    <input type="range">
                </label>
                <label for="">
                    29 (11.65%)
                    <input type="range">
                </label>
                <label for="">
                    28 (11.24%)
                    <input type="range">
                </label>
                <label for="">
                    22 (8.84%)
                    <input type="range">
                </label>
                <label for="">
                    21 (8.43%)
                    <input type="range">
                </label>
            </div>
            <select name="" id="">See more</select>
        </div>
    </section>
    <footer>
        <p>Diseñado por Lucia Tesei</p>
    </footer>
</body>
</html>
