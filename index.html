<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Character Counter</title>
    <link rel="stylesheet" href="./css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Changa+One:ital@0;1&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Space+Grotesk:wght@300..700&display=swap" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Changa+One:ital@0;1&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Space+Grotesk:wght@300..700&display=swap" rel="stylesheet">
</head>
<body>
    <section class="hero">
        <header>
            <div class="principal">
                <img src="assets/images/logo.jpg" alt="logo" class="logo" width="200px" height="200px">
                <p class="counter">Character Counter</p>
            </div>
            <div>
                <button type="button"><img src="assets/images/sol.jpg" alt="light" width="50px" height="50px"></button>
            </div>
        </header>
        <h1 class="title">Analyze your text <br> in real-time.</h1>
        <div class="contenedor">
            <label class="flotante">Design is the silent ambassador of your brand. Simplicity is key to effective <br> communication, creating clarity in every interaction. A great design <br> transforms complex ideas into elegant solutions, making them easy to <br> understand. It blends aesthetics and functionality seamlessly.</label>
            <textarea></textarea>
        </div>
    <section class="controls">
        <div class="check">
            <label>
                    <input type="checkbox" class="checkbox">
                    Exclude Spaces
                </label>
                <label>
                    <input type="checkbox" class="checkbox">
                    Set Character Limit
                </label>
        </div>
        <div>
            <label class="Approx">Approx. reading time: <1 minute</label>
        </div>
    </section>
    <section class="metrics">
        <div class="metric">
            <img src="assets/images/violet.jpg" alt="Fondo violeta" class="img" width="700px" height="350px">
            <p class="top"><b>278</b><br>Total Characters</p>
        </div>
        <div class="metric">
            <img src="assets/images/orange.jpg" alt="Fondo naranja" class="img" width="700px" height="350px">
            <p class="top"><b>39</b><br>Word Count</p>
        </div>
        <div class="metric">
            <img src="assets/images/pastel.jpg" alt="Fondo naranja pastel" class="img" width="700px" height="350px">
            <p class="top"><b>04</b><br>Sentence Count</p>
        </div>
    </section>
    <section class="letter">
        <h3>Letter Density</h3>
        <label class="let">
            E
            <progress value="16.06" max="100"></progress>
            40 (16.06%)
        </label>
        <label class="let">
            I
            <progress value="11.65" max="100"></progress>
            29 (11.65%)
        </label>
        <label class="let">
            T
            <progress value="11.24" max="100"></progress>
            28 (11.24%)
        </label>
        <label class="let">
            O
            <progress value="8.84" max="100"></progress>
            22 (8.84%)
        </label>
        <label class="let">
            N
            <progress value="8.43" max="100"></progress>
            21 (8.43%)
        </label>
        <br>
        <label>
            See more
            <select></select>
    </section>

    <footer>
        <p>Diseñado por Lucia Tesei</p>
    </footer>
</body>
</html>
